<div class="rm-note" style="position: absolute; left: 40px; top: 32px; max-width: 520px; flex-direction: column; align-items: flex-start; gap: 12px; color: #FFFFFF; font-family: 'Fira Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #C5CBE3;">O teu sistema está com "reduzir movimento" ligado, então a animação fica parada de propósito, por acessibilidade.</p>
<button onClick="{{ force }}" style="min-height: 44px; padding: 0 20px; background: #E7AC29; color: #1A223C; border: none; border-radius: 6px; font-family: 'Fira Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;">{{ forceLabel }}</button>
</div>
<button onClick="{{ toggle }}" style="position: absolute; right: 40px; bottom: 36px; min-height: 44px; padding: 0 22px; background: transparent; color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 6px; font-family: 'Fira Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; cursor: pointer;">{{ label }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 720}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    if (!this._toggle) {
      this._toggle = () => this.setState({ paused: !(this.state && this.state.paused) });
      this._force = () => this.setState({ force: !(this.state && this.state.force) });
    }
    const cls = ['ul-root'];
    if (s.paused) cls.push('ul-paused');
    if (s.force) cls.push('ul-force');
    return {
      rootClass: cls.join(' '),
      label: s.paused ? 'Continuar animação' : 'Pausar animação',
      toggle: this._toggle,
      force: this._force,
      forceLabel: s.force ? 'Voltar ao modo sem movimento' : 'Ver a animação mesmo assim'
    };
  }
}
</script>
