services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanlink}
      POSTGRES_USER: ${POSTGRES_USER:-urbanlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanlink_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - urbanlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-urbanlink} -d ${POSTGRES_DB:-urbanlink}']
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  urbanlink_postgres_data:
